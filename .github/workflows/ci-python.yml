name: CI - Python

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'python/**'
      - '.github/workflows/ci-python.yml'
  push:
    branches: [ main ]
    paths:
      - 'python/**'
      - '.github/workflows/ci-python.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python

jobs:
  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install hatch
        run: pip install hatch

      - name: Run tests
        run: hatch run test

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install hatch
        run: pip install hatch

      - name: Check formatting
        run: hatch run format

      - name: Run linter
        run: hatch run lint

      - name: Type check
        run: hatch run typecheck

  integration:
    name: Integration - Dakera server 0.12.3
    runs-on: ubuntu-latest
    needs: [test]
    services:
      dakera:
        image: ghcr.io/dakera-ai/dakera:0.12.3
        ports:
          - 3300:3300
        env:
          DAKERA_AUTH_ENABLED: "false"
          DAKERA_ROOT_API_KEY: test-key
          DAKERA_HOST: "0.0.0.0"
          DAKERA_PORT: "3300"
        # No in-container --health-cmd: images >= 0.12.3 ship no curl. Readiness is
        # polled from the runner in "Wait for Dakera to be ready".
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install hatch
        run: pip install hatch

      - name: Wait for Dakera to be ready
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3300/health; then
              echo "Dakera is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Dakera did not become ready in time"
          exit 1

      - name: Run integration tests
        env:
          DAKERA_TEST_URL: http://localhost:3300
          DAKERA_API_KEY: test-key
        run: hatch run test tests/test_integration.py -v
